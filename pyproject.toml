[build-system]
# pybind11 is pinned below 4 deliberately: PYBIND11_MODULE changed to multi-phase init in 3.0.0,
# and the pin is about reproducible builds, not speed.
requires = ["scikit-build-core>=0.10", "pybind11>=3.0.2,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "migec"
version = "2.5.1"  # keep in sync with include/migec/version.hpp and python/migec/__init__.py
description = "UMI barcode extraction, correction and consensus assembly for barcoded sequencing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mikhail Shugay", email = "mikhail.shugay@gmail.com" }]
keywords = ["umi", "barcode", "consensus", "airr", "repseq", "single-cell", "sequencing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    # One row per interpreter the wheels are actually built for (publish.yml's cibuildwheel
    # matrix). PyPI's sidebar filters on these, so a package that ships four and declares none
    # looks like it supports nothing.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
# typer and nothing else. Every stage writes its tables with the standard library, and the plots
# are gnuplot reading those tables -- so a wheel installed to run the pipeline pulls no dataframe
# library and no plotting stack. polars is the notebooks' dependency, and lives with them.
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
# seqtree is NOT a core dependency. Every hot path here searches a fixed-length barcode at <=1
# substitution, where enumerating the 3L neighbours in a hash table beats a trie by orders of
# magnitude. seqtree earns its place only for whitelist lookup at >=2 substitutions, N-wildcard
# barcodes, and k-mer adapter discovery in `migec suggest` -- all opt-in.
seqtree = ["seqtree>=0.6"]
# `migec plot` shells out to gnuplot, which is not a python package. These are what the marimo
# notebooks under notebooks/ import.
notebooks = ["polars>=1.0", "marimo", "matplotlib>=3.8"]
docs = ["sphinx", "pydata-sphinx-theme"]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "pytest", "pybind11", "marimo"]

[project.scripts]
migec = "migec.cli:app"

[project.urls]
Homepage = "https://github.com/antigenomics/migec"
Documentation = "https://antigenomics.github.io/migec/"

[tool.scikit-build]
wheel.packages = ["python/migec"]
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
editable.rebuild = true      # a .cpp edit takes effect on the next `import migec`
editable.verbose = false

[tool.scikit-build.cmake.define]
MIGEC_PYTHON = "ON"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly: ruff's defaults widen between releases, which turns a green local run into
# a red CI on an unrelated change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
